name: Build PHASER VST3 (Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar (CMake + JUCE se descarga solo)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar Release
        run: cmake --build build --config Release --target PHASER_VST3 --parallel

      - name: Empaquetar VST3
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Recurse -Directory -Filter "PHASER.vst3" | Select-Object -First 1
          if (-not $vst) { throw "No se encontro PHASER.vst3" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse $vst.FullName dist/PHASER.vst3
          Compress-Archive -Path dist/PHASER.vst3 -DestinationPath PHASER-VST3-Windows.zip

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PHASER-VST3-Windows
          path: PHASER-VST3-Windows.zip

      - name: Publicar release (solo con tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PHASER-VST3-Windows.zip
